name: Build research banner once

on:
  push:
    paths:
      - '.github/workflows/build-research-banner.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct banner
        run: |
          cat assets/images/.research-banner.part* | base64 -d > assets/images/research-banner.jpg
          rm assets/images/.research-banner.part*
          rm .github/workflows/build-research-banner.yml
      - name: Commit banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add research banner image"
          git push
